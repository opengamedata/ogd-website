name: CI Script - OGD Website
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'push' && github.event.head_commit.message || 'Manual Run') }}

on:
  workflow_dispatch: # Allow manual trigger of this workflow from the Actions tab
    inputs:
      use_custom_api:
        type: boolean
        description: "Use Custom API: If true, website will use the given alternate API endpoint."
        required: true
        default: false
      CUSTOM_API_ENDPOINT:
        description: "Custom API Endpoint: Set an alternate path to a website API wsgi app."
        required: false
        default: "https://ogd-services.fielddaylab.wisc.edu/wsgi-bin/opengamedata-website-api/production/app.wsgi/"
  push: # Trigger automatically when we do a push to the site.
    branches-ignore:
    - 'main'
    paths:
    - '.github/workflows/CI_website.yml'
    - '.github/actions/**'
    - 'src/**'
    - 'gulpfile.js'
    - 'package.json'

env:
  DASH_URL: https://${{vars.OGD_SERVICES_HOST}}/designer-dashboard/v1.0.0/
  
jobs:
  setup:
    name: Get Branch
    runs-on: ubuntu-24.04
    outputs:
      branch_tag: ${{ steps.get_branch.outputs.branch-name }}
    steps:
      - name: Get Branch
        id: get_branch
        uses: opengamedata/actions-get-branch@v1.1
        with:
          n: 20
          remove: '\.'

  build:
    name: Build Docker Image
    needs: [setup, package]
    uses: ./.github/workflows/BUILD_FileAPI.yml
    with:
      image_tag: ${{ needs.setup.outputs.branch_tag }}
      api_url: "https://file.api.opengamedata.io"
      dashboard_url: ${{ env.DASH_URL }}
    secrets:
      image_repository: ${{ secrets.DOCKER_IMAGE_REPO }}

  # build_api_testing:
  #   name: Build Docker Image
  #   if: # TODO : sort out the 'if' cases for this and build and deploy to get things working nicely
  #   needs: [setup, package]
  #   uses: ./.github/workflows/BUILD_FileAPI.yml
  #   with:
  #     image_tag: ${{ needs.setup.outputs.branch_tag }}
  #     api_url: ${{ inputs.CUSTOM_API_ENDPOINT }}
  #     dashboard_url: ${{ env.DASH_URL }}
  #   secrets:
  #     image_repository: ${{ secrets.DOCKER_IMAGE_REPO }}

  deploy:
    name: CI Deploy to GCP
    needs: [setup, build]
    uses: ./.github/workflows/DEPLOY_FileAPI.yml
    with:
      service_name: "ogd-website-test"
      image_name: ${{ needs.build.outputs.image_name }}
      revision_tag: "t-${{ needs.setup.outputs.branch_tag }}-t"
      remove: false
    secrets: inherit

  testbed_webpages:
    name: Run cURL Testing Script
    needs: deploy
    uses: ./.github/workflows/TEST_webpages.yml
    with:
      custom_deploy_url: ${{ needs.deploy.outputs.url }}
