name: OGD Website - Release Script
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'push' && github.ref || 'Manual Run') }}

# Controls when the action will run. Triggers the workflow on creation of 
# tags.  Creating new 'versions' via github is the most straightforward 
# way of doing this.
on:
  workflow_dispatch:
  #create:
  #  tags:
  #    - '*'
  push: # Trigger automatically when we do a merge to production
     branches: [ production ]

jobs:
  build:
    name: Build Docker Image
    uses: ./.github/workflows/BUILD_website.yml
    with:
      image_tag: ${{ github.ref_name }}
      api_url: "https://file.api.opengamedata.io"
      dashboard_url: &dash_url https://${{vars.OGD_SERVICES_HOST}}/designer-dashboard/v1.0.0/
    secrets:
      image_repository: ${{ secrets.DOCKER_IMAGE_REPO }}

  get_branch:
    name: Get Branch
    runs-on: ubuntu-24.04
    outputs:
      branch_tag: ${{ steps.get_branch.outputs.branch-name }}
    steps:
      - name: Get Branch
        id: get_branch
        uses: opengamedata/actions-get-branch@v1.1
        with:
          n: 20
          remove: '\.'

  deploy:
    name: CI Deploy to GCP
    needs: [build, get_branch]
    uses: ./.github/workflows/DEPLOY_website.yml
    with:
      service_name: "ogd-website"
      image_name: ${{ needs.build.outputs.image_name }}
      revision_tag: ${{ case(github.event.action == 'released', 'latest', needs.get_branch.outputs.branch_tag) }}
      remove:       false
      as_latest:    ${{ case(github.event.action == 'released', true, false) }}
    secrets: inherit

  testbed_webpages:
    name: Run cURL Testing Script
    needs: deploy
    uses: ./.github/workflows/TEST_webpages.yml
    with:
      custom_deploy_url: ${{ needs.deploy.outputs.url }}
